[build]
  publish = "."
  command = "node generate-article-pages.js"

[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"

[context.production.environment]
  NODE_ENV = "production"

[context.deploy-preview.environment]
  NODE_ENV = "preview"

# ── Per-language prerendered article paths (specific first) ──
[[redirects]]
  from = "/explore/:id/:lang"
  to = "/explore/:id/:lang/index.html"
  status = 200

[[redirects]]
  from = "/news/:id/:lang"
  to = "/news/:id/:lang/index.html"
  status = 200

# ── Default-language (English) prerendered article paths ──
[[redirects]]
  from = "/explore/:id"
  to = "/explore/:id/index.html"
  status = 200

[[redirects]]
  from = "/news/:id"
  to = "/news/:id/index.html"
  status = 200

# ── Backwards-compat: old ?article= URLs still work for humans ──
[[redirects]]
  from = "/news/:article"
  to = "/AN_news.html?article=:article"
  status = 200

[[redirects]]
  from = "/explore/:article"
  to = "/AN_explore.html?article=:article"
  status = 200

[[redirects]]
  from = "/explore/:article/:lang"
  to = "/AN_explore.html?article=:article&lang=:lang"
  status = 200

# ── Cache / security headers ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Static assets — long cache OK (icons, images, screenshots rarely change)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ⚠️ FIX: CSS and JS are NOT content-hashed on this site.
# Immutable caching was serving old data.js / data_explore.js etc. for a
# year, regardless of the Service Worker. Revalidate every request instead.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# SW must never be cached
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"